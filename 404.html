<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // SPA redirect for GitHub Pages
      // Converts path to query param and redirects to index
      (function() {
        var l = window.location;
        // /leisure/mona-yongpyong → /?p=/leisure/mona-yongpyong
        var newSearch = "?p=" + encodeURIComponent(
          l.pathname.replace(/\/t-ride2/, '') + l.search
        );
        var newUrl = l.protocol + "//" + l.host + "/t-ride2/" + newSearch + l.hash;
        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
